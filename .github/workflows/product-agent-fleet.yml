# TODO: switch @main to @v1 once CreativeWare framework v1.0.0 is tagged.
name: "🏢 Product Agent Fleet — SynthData"
on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [agent-fleet-trigger]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
jobs:
  product-fleet:
    timeout-minutes: 30
    uses: fratei/creative-ware-hq/.github/workflows/reusable-product-fleet.yml@main
    with:
      registry_path: products/registry.json
    secrets: inherit
