apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthdata-api
  labels:
    app: synthdata-api
    product: synthdata
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synthdata-api
  template:
    metadata:
      labels:
        app: synthdata-api
    spec:
      containers:
        - name: synthdata-api
          image: ghcr.io/fratei/synthdata-app:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_NAME
              value: "SynthData"
            - name: PORT
              value: "8000"
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: synthdata-secrets
                  key: azure-openai-endpoint
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: synthdata-secrets
                  key: azure-openai-api-key
            - name: AZURE_SPEECH_KEY
              valueFrom:
                secretKeyRef:
                  name: synthdata-secrets
                  key: azure-speech-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
