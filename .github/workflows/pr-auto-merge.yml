name: "🤖 Autonomous PR Pipeline"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: pr-pipeline
  cancel-in-progress: false

jobs:
  auto-ready-drafts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 20,
            });
            for (const pr of prs) {
              if (!pr.draft) continue;
              const isCopilot = pr.user?.login === 'copilot[bot]' ||
                pr.head?.ref?.startsWith('copilot/');
              if (!isCopilot) continue;
              console.log(`Marking PR #${pr.number} ready...`);
              try {
                await github.graphql(`mutation { markPullRequestReadyForReview(input: { pullRequestId: "${pr.node_id}" }) { pullRequest { number } } }`);
              } catch (e) {
                console.log(`  Failed: ${e.message}`);
              }
            }

  classify-and-merge:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 20,
            });

            for (const pr of prs) {
              if (pr.draft) continue;
              const isCopilot = pr.user?.login === 'copilot[bot]' ||
                pr.head?.ref?.startsWith('copilot/');
              if (!isCopilot) continue;

              // Check soak time (10 min for copilot PRs)
              const created = new Date(pr.created_at).getTime();
              const soakMs = 10 * 60 * 1000;
              if (Date.now() - created < soakMs) {
                console.log(`PR #${pr.number} still soaking...`);
                continue;
              }

              // Auto-approve
              try {
                const { data: reviews } = await github.rest.pulls.listReviews({
                  owner, repo, pull_number: pr.number,
                });
                const hasApproval = reviews.some(r => r.state === 'APPROVED');
                if (!hasApproval) {
                  await github.rest.pulls.createReview({
                    owner, repo, pull_number: pr.number,
                    event: 'APPROVE',
                    body: '🤖 Auto-approved (copilot PR, passed soak window)',
                  });
                  console.log(`Approved PR #${pr.number}`);
                }
              } catch (e) {
                console.log(`Approve failed for #${pr.number}: ${e.message}`);
              }

              // Auto-merge
              try {
                if (pr.mergeable === false) {
                  console.log(`PR #${pr.number} has conflicts, skipping`);
                  continue;
                }
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number,
                  merge_method: 'squash',
                });
                console.log(`Merged PR #${pr.number}`);
              } catch (e) {
                console.log(`Merge failed for #${pr.number}: ${e.message}`);
              }
            }
