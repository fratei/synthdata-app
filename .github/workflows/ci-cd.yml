name: "🔄 CI/CD Pipeline"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── PR checks: frontend lint + backend tests ───────────────────────────
  pr-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend app readiness
        id: frontend
        run: |
          if [ -d frontend/app ] || [ -d frontend/pages ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.frontend.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend.outputs.ready == 'true'
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        if: steps.frontend.outputs.ready == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Skip frontend lint (frontend scaffold not ready)
        if: steps.frontend.outputs.ready != 'true'
        run: echo "Skipping frontend lint until frontend/app or frontend/pages exists."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test backend
        working-directory: backend
        run: pytest tests/ -v

  # ─── Push to main: frontend build + deploy ──────────────────────────────
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend app readiness
        id: frontend
        run: |
          if [ -d frontend/app ] || [ -d frontend/pages ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.frontend.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend.outputs.ready == 'true'
        working-directory: frontend
        run: npm install

      - name: Build frontend
        if: steps.frontend.outputs.ready == 'true'
        working-directory: frontend
        run: npm run build --if-present

      - name: Skip frontend build (frontend scaffold not ready)
        if: steps.frontend.outputs.ready != 'true'
        run: echo "Skipping frontend build until frontend/app or frontend/pages exists."

      # TODO: Add deployment steps specific to this product
      - name: Deploy placeholder
        run: echo "🚀 Deploy step not yet configured for SynthData"

      # Post-deploy health check
      - name: Post-deploy health check
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'incident-detected',
              client_payload: {
                pattern: 'Deploy failed',
                severity: 'critical',
                count: 1,
                hop_count: 0,
              },
            });
