# TODO: switch @main to @v1 once CreativeWare framework v1.0.0 is tagged.
name: "👁️ Observability Agent — SynthData"
on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
jobs:
  observability:
    timeout-minutes: 30
    uses: fratei/creative-ware-hq/.github/workflows/reusable-observability.yml@main
    with:
      product_name: "SynthData"
      dashboard_path: docs/agents/DASHBOARD.md
    secrets: inherit
